
name: IFC Digital Project Assignments Database Test

on:
  push:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-project-assignments-db:
    name: Test PostgreSQL Project Assignments
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ifc_test
          POSTGRES_PASSWORD: ifc_test_password
          POSTGRES_DB: ifc_assignments_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifc_test -d ifc_assignments_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IFC_TEST_DATABASE_URL: postgresql://ifc_test:ifc_test_password@localhost:5432/ifc_assignments_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile project_assignments_db_test.py
          python -m py_compile project_assignments.py
          python -m py_compile project_permissions.py

      - name: Run PostgreSQL integration tests
        run: |
          python project_assignments_db_test.py
