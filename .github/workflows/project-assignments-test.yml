
name: IFC Digital Project Assignments Test

on:
  push:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-project-assignments:
    name: Test Project Assignments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile project_assignments.py
          python -m py_compile project_assignments_test.py
          python -m py_compile project_permissions.py
          python -m py_compile auth_service.py

      - name: Run project assignment tests
        run: |
          python project_assignments_test.py
