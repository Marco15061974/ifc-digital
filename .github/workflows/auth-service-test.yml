
name: IFC Digital Authentication Service Test

on:
  push:
    branches:
      - sprint-user-authentication
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-auth-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ifc_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ifc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifc_test -d ifc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ifc_test:test_password@localhost:5432/ifc_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Check Python syntax
        run: python -m py_compile auth.py auth_service.py

      - name: Test database authentication
        run: |
          python - <<'PY'
          import os
          import secrets
          from pathlib import Path

          import psycopg

          from auth import hash_password
          from auth_service import (
              AuthenticationService,
              AuthenticationError,
          )

          database_url = os.environ["DATABASE_URL"]
          secret = secrets.token_bytes(32)
          password = "IFC-Test-2026-Sicher!"

          with psycopg.connect(database_url) as conn:
              for filename in (
                  "001_subcontractor_schema.sql",
                  "002_users_roles_schema.sql",
              ):
                  sql = (
                      Path("database/migrations") / filename
                  ).read_text(encoding="utf-8")
                  conn.execute(sql)

              with conn.cursor() as cur:
                  cur.execute(
                      """
                      INSERT INTO ifc_users
                          (email, display_name, password_hash)
                      VALUES (%s, %s, %s)
                      RETURNING id
                      """,
                      (
                          "test@example.test",
                          "IFC Testbenutzer",
                          hash_password(password),
                      ),
                  )
                  user_id = cur.fetchone()[0]

                  cur.execute(
                      """
                      INSERT INTO ifc_user_roles
                          (user_id, role_id)
                      SELECT %s, id
                      FROM ifc_roles
                      WHERE code = 'admin'
                      """,
                      (user_id,),
                  )

              conn.commit()

          service = AuthenticationService(
              database_url=database_url,
              session_secret=secret,
          )

          result = service.login(
              "test@example.test", password
          )
          assert result["user"]["id"] == user_id
          assert result["token"]

          current = service.authenticate(result["token"])
          assert current is not None
          assert current["id"] == user_id

          try:
              service.login(
                  "test@example.test", "wrong-password"
              )
              raise AssertionError("Wrong password accepted")
          except AuthenticationError:
              pass

          assert "admin" in service.get_roles(user_id)
          assert service.has_permission(
              user_id, "projects.read"
          )
          assert service.has_permission(
              user_id, "finance.read"
          )

          assert not service.can_access_project(
              user_id, "IFC-TEST-001", "projects.read"
          )

          with psycopg.connect(database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      INSERT INTO ifc_project_access
                          (user_id, project_id, access_role)
                      VALUES (%s, %s, %s)
                      """,
                      (user_id, "IFC-TEST-001", "manager"),
                  )
              conn.commit()

          assert service.can_access_project(
              user_id, "IFC-TEST-001", "projects.read"
          )

          with psycopg.connect(database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      UPDATE ifc_project_access
                      SET revoked_at = NOW()
                      WHERE user_id = %s
                      """,
                      (user_id,),
                  )
              conn.commit()

          assert not service.can_access_project(
              user_id, "IFC-TEST-001", "projects.read"
          )

          with psycopg.connect(database_url) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      UPDATE ifc_users
                      SET active = FALSE
                      WHERE id = %s
                      """,
                      (user_id,),
                  )
              conn.commit()

          assert service.authenticate(
              result["token"]
          ) is None

          try:
              service.login("test@example.test", password)
              raise AssertionError("Inactive user accepted")
          except AuthenticationError:
              pass

          print("IFC authentication service tests passed")
          PY
