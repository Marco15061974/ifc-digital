
name: IFC Digital HTTP Integration Test

on:
  push:
    branches:
      - sprint-project-permissions
    paths:
      - 'sprint342/http_integration_test.py'
      - 'sprint342/server_staging_v3.py'
      - 'server_staging_v2.py'
      - 'server.py'
      - 'project_permissions.py'
      - '.github/workflows/http-integration-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  http-integration:
    name: Test HTTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Check Python syntax
        run: |
          python -m py_compile sprint342/server_staging_v3.py
          python -m py_compile sprint342/http_integration_test.py

      - name: Run HTTP integration tests
        run: python sprint342/http_integration_test.py
