
name: IFC Digital Staging Server V2 Test

on:
  push:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-staging-server:
    name: Test Staging Server HTTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile server.py
          python -m py_compile server_staging_v2.py
          python -m py_compile server_staging_v2_test.py
          python -m py_compile project_assignments.py
          python -m py_compile project_assignments_api.py

      - name: Run staging HTTP tests
        run: |
          python server_staging_v2_test.py
