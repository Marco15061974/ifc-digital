
name: IFC Digital Permissions Integration Test

on:
  push:
    branches:
      - sprint-project-permissions
    paths:
      - 'sprint342/integration_permissions_test.py'
      - 'auth_service.py'
      - 'auth.py'
      - 'project_assignments.py'
      - 'project_permissions.py'
      - '.github/workflows/integration-permissions-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-permissions:
    name: Test Permissions Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Check Python syntax
        run: |
          python -m py_compile auth_service.py
          python -m py_compile project_assignments.py
          python -m py_compile project_permissions.py
          python -m py_compile sprint342/integration_permissions_test.py

      - name: Run permissions integration tests
        run: python sprint342/integration_permissions_test.py
