
name: IFC Digital Management Backend Test

on:
  push:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-management-backend:
    name: Test Management Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile project_management_backend_test.py
          python -m py_compile project_assignments.py
          python -m py_compile project_permissions.py

      - name: Run backend permission tests
        run: |
          python project_management_backend_test.py
