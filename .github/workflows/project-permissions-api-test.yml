
name: IFC Digital Project Permissions API Test

on:
  push:
    branches:
      - sprint-project-permissions
    paths:
      - 'sprint342/project_permissions_api_test.py'
      - 'project_permissions.py'
      - 'auth_service.py'
      - '.github/workflows/project-permissions-api-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-permissions-api:
    name: Test Project Permissions API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Check Python syntax
        run: python -m py_compile sprint342/project_permissions_api_test.py

      - name: Run permission API tests
        run: python sprint342/project_permissions_api_test.py
