
name: IFC Digital Project Permissions HTTP Test

on:
  push:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-project-permissions-http:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Check server syntax
        run: |
          python -m py_compile server.py
          python -m py_compile project_permissions.py

      - name: Run existing server authentication tests
        run: |
          python server_auth_test.py

      - name: Run project permissions tests
        run: |
          python project_permissions_test.py

      - name: Run HTTP authorization tests
        run: |
          python project_permissions_http_test.py
