name: IFC Digital Staging V4 Test

on:
  push:
    branches:
      - sprint-project-permissions
  pull_request:
    branches:
      - sprint-project-permissions
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-v4-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      IFC_ENABLE_LEGACY_API_TOKEN: "false"
      IFC_ALLOWED_ORIGIN: "https://marco15061974.github.io"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Configure isolated test environment
        run: |
          python -c "import secrets; print('IFC_SESSION_SECRET_HEX=' + secrets.token_hex(32))" >> "$GITHUB_ENV"

      - name: Check Python syntax
        run: |
          python -m py_compile sprint342/server_staging_v4.py
          python -m py_compile sprint342/server_staging_v4_test.py

      - name: Run Staging V4 tests
        run: |
          python sprint342/server_staging_v4_test.py
