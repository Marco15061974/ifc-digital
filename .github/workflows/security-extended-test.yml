name: IFC Digital Extended Security Test

on:
  push:
    branches:
      - sprint-project-permissions
    paths:
      - 'sprint342/security_extended_test.py'
      - 'project_permissions.py'
      - 'project_assignments.py'
      - '.github/workflows/security-extended-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-security-tests:
    name: Test Extended Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Check Python syntax
        run: python -m py_compile sprint342/security_extended_test.py

      - name: Run extended security tests
        run: python sprint342/security_extended_test.py
