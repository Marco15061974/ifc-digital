
name: IFC Digital Staging V3 Test

on:
  push:
    branches:
      - sprint-project-permissions
    paths:
      - 'sprint342/server_staging_v3.py'
      - 'sprint342/server_staging_v3_test.py'
      - '.github/workflows/server-staging-v3-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-v3-tests:
    name: Test Staging V3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'psycopg[binary]'

      - name: Check Python syntax
        run: |
          python -m py_compile sprint342/server_staging_v3.py
          python -m py_compile sprint342/server_staging_v3_test.py

      - name: Run Staging V3 tests
        run: python sprint342/server_staging_v3_test.py
