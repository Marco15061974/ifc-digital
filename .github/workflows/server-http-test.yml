
name: IFC Digital Server HTTP Security Test

on:
  push:
    branches:
      - sprint-user-authentication
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server-http:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ifc_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ifc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifc_test -d ifc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ifc_test:test_password@localhost:5432/ifc_test
      IFC_SESSION_SECRET_HEX: 4e6b3a8d12c9f075e1a42b6c3d9f80125a7c4e6d8b0f1392c5e7a9d1b3f60842
      IFC_ENABLE_LEGACY_API_TOKEN: "false"
      PORT: "18080"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Check Python syntax
        run: |
          python -m py_compile server.py
          python -m py_compile auth.py
          python -m py_compile auth_service.py

      - name: Run HTTP security tests
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          import psycopg
          from auth import hash_password

          base = "http://127.0.0.1:18080"
          db = os.environ["DATABASE_URL"]

          with psycopg.connect(db) as conn:
              for name in (
                  "001_subcontractor_schema.sql",
                  "002_users_roles_schema.sql",
              ):
                  sql = (
                      Path("database/migrations") / name
                  ).read_text(encoding="utf-8")
                  conn.execute(sql)

              with conn.cursor() as cur:
                  cur.execute(
                      """
                      INSERT INTO ifc_users
                        (email, display_name, password_hash)
                      VALUES (%s, %s, %s)
                      RETURNING id
                      """,
                      (
                          "http-test@example.test",
                          "HTTP Test User",
                          hash_password("TestPassword-2026!"),
                      ),
                  )
                  user_id = cur.fetchone()[0]

                  cur.execute(
                      """
                      INSERT INTO ifc_user_roles
                        (user_id, role_id)
                      SELECT %s, id FROM ifc_roles
                      WHERE code = 'admin'
                      """,
                      (user_id,),
                  )

                  cur.execute(
                      """
                      INSERT INTO ifc_project_access
                        (user_id, project_id, access_role)
                      VALUES (%s, %s, 'manager')
                      """,
                      (user_id, "PRJ-0041"),
                  )

          def request(path, method="GET", data=None, token=None):
              headers = {}
              body = None

              if data is not None:
                  body = json.dumps(data).encode("utf-8")
                  headers["Content-Type"] = "application/json"

              if token:
                  headers["Authorization"] = "Bearer " + token

              req = urllib.request.Request(
                  base + path,
                  data=body,
                  headers=headers,
                  method=method,
              )

              try:
                  with urllib.request.urlopen(
                      req, timeout=5
                  ) as response:
                      return (
                          response.status,
                          json.load(response),
                      )
              except urllib.error.HTTPError as error:
                  return (
                      error.code,
                      json.loads(error.read()),
                  )

          proc = subprocess.Popen(
              [sys.executable, "server.py"],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.PIPE,
          )

          try:
              for attempt in range(40):
                  if proc.poll() is not None:
                      raise RuntimeError(
                          "Server stopped unexpectedly"
                      )
                  try:
                      status, _ = request("/health")
                      if status == 200:
                          break
                  except (
                      urllib.error.URLError,
                      TimeoutError,
                  ):
                      time.sleep(0.25)
              else:
                  raise RuntimeError("Server did not start")

              assert request("/health")[0] == 200

              protected = (
                  "/api/v1/auth/me",
                  "/api/v1/test-project",
                  "/api/v1/subcontractors",
                  "/api/v1/measurements",
              )

              for path in protected:
                  assert request(path)[0] == 401, path

              login_path = "/api/v1/auth/login"

              assert request(
                  login_path,
                  "POST",
                  {
                      "email": "http-test@example.test",
                      "password": "wrong-password",
                  },
              )[0] == 401

              status, result = request(
                  login_path,
                  "POST",
                  {
                      "email": "http-test@example.test",
                      "password": "TestPassword-2026!",
                  },
              )

              assert status == 200, result
              token = result["token"]

              status, current = request(
                  "/api/v1/auth/me", token=token
              )
              assert status == 200, current
              assert current["user"]["id"] == user_id

              status, project = request(
                  "/api/v1/test-project", token=token
              )
              assert status == 200, project

              status, created = request(
                  "/api/v1/subcontractors",
                  "POST",
                  {"company_name": "IFC HTTP Test"},
                  token,
              )
              assert status == 201, created

              assert request(
                  "/api/v1/subcontractors",
                  token=token,
              )[0] == 200

              assert request(
                  "/api/v1/measurements",
                  "POST",
                  {"room": "Test", "width": 1000},
                  token,
              )[0] == 401

              with psycopg.connect(db) as conn:
                  conn.execute(
                      """
                      UPDATE ifc_project_access
                      SET revoked_at = NOW()
                      WHERE user_id = %s
                      """,
                      (user_id,),
                  )

              assert request(
                  "/api/v1/test-project", token=token
              )[0] == 403

              with psycopg.connect(db) as conn:
                  conn.execute(
                      """
                      UPDATE ifc_users
                      SET active = FALSE WHERE id = %s
                      """,
                      (user_id,),
                  )

              assert request(
                  "/api/v1/auth/me", token=token
              )[0] == 401

              print("IFC HTTP security tests passed")

          finally:
              proc.terminate()
              try:
                  proc.communicate(timeout=5)
              except subprocess.TimeoutExpired:
                  proc.kill()
                  proc.communicate()
          PY
