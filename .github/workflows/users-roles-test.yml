
name: IFC Digital Users Roles Database Test

on:
  push:
    branches:
      - sprint-subcontractor-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-users-roles:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ifc_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: ifc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ifc_test -d ifc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ifc_test:test_password@localhost:5432/ifc_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PostgreSQL driver
        run: python -m pip install "psycopg[binary]>=3.2,<4"

      - name: Test users and roles database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg

          db_url = os.environ['DATABASE_URL']
          folder = Path('database/migrations')

          with psycopg.connect(db_url) as conn:
              for filename in (
                  '001_subcontractor_schema.sql',
                  '002_users_roles_schema.sql'
              ):
                  sql = (folder / filename).read_text(
                      encoding='utf-8'
                  )
                  conn.execute(sql)

              with conn.cursor() as cur:
                  cur.execute('SELECT code FROM ifc_roles')
                  roles = {row[0] for row in cur.fetchall()}

                  expected = {
                      'admin',
                      'office',
                      'surveyor',
                      'installer',
                      'subcontractor',
                      'client_manager'
                  }
                  assert roles == expected, roles

                  cur.execute(
                      'SELECT COUNT(*) FROM ifc_permissions'
                  )
                  assert cur.fetchone()[0] == 16

                  cur.execute("""
                      SELECT COUNT(*)
                      FROM ifc_role_permissions rp
                      JOIN ifc_roles r ON r.id = rp.role_id
                      WHERE r.code = 'admin'
                  """)
                  assert cur.fetchone()[0] == 16

                  cur.execute("""
                      INSERT INTO ifc_users
                          (email, display_name, account_type)
                      VALUES (%s, %s, %s)
                      RETURNING id
                  """, (
                      'bauleiter@example.test',
                      'Test Bauleiter',
                      'external'
                  ))
                  user_id = cur.fetchone()[0]

                  cur.execute("""
                      INSERT INTO ifc_user_roles
                          (user_id, role_id)
                      SELECT %s, id FROM ifc_roles
                      WHERE code = 'client_manager'
                  """, (user_id,))

                  cur.execute("""
                      INSERT INTO ifc_project_access
                          (user_id, project_id, access_role)
                      VALUES (%s, %s, %s)
                  """, (
                      user_id, 'IFC-TEST-001', 'approver'
                  ))

                  cur.execute("""
                      SELECT access_role
                      FROM ifc_project_access
                      WHERE user_id = %s
                        AND project_id = %s
                        AND revoked_at IS NULL
                  """, (user_id, 'IFC-TEST-001'))
                  assert cur.fetchone()[0] == 'approver'

                  cur.execute("""
                      INSERT INTO ifc_user_permissions
                          (user_id, permission_id, allowed)
                      SELECT %s, id, TRUE
                      FROM ifc_permissions
                      WHERE code = 'reports.read'
                  """, (user_id,))

                  cur.execute("""
                      SELECT allowed
                      FROM ifc_user_permissions up
                      JOIN ifc_permissions p
                        ON p.id = up.permission_id
                      WHERE up.user_id = %s
                        AND p.code = 'reports.read'
                  """, (user_id,))
                  assert cur.fetchone()[0] is True

                  cur.execute("""
                      INSERT INTO ifc_access_audit
                          (actor_user_id, target_user_id,
                           action, details)
                      VALUES (%s, %s, %s, %s::jsonb)
                  """, (
                      user_id, user_id,
                      'test.permission_granted',
                      '{"test":true}'
                  ))

                  cur.execute("""
                      SELECT COUNT(*)
                      FROM ifc_access_audit
                      WHERE target_user_id = %s
                  """, (user_id,))
                  assert cur.fetchone()[0] == 1

              conn.rollback()

          print('IFC Digital users and roles tests passed')
          PY
